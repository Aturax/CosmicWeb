<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | Cosmic Works</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#a51e1e">
<link rel="icon" type="image/png" href="/assets/cosmic-mark-red.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Work+Sans:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Página de error de GitHub Pages: se sirve para cualquier dirección que no existe */
:root{color-scheme:light;--red:#a51e1e;--red-deep:#7d1414;--white:#fff;--ink:#2a1414}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--red);color:var(--white);font-family:"Work Sans",system-ui,sans-serif;font-size:17px;line-height:1.6;display:grid;place-items:center;padding:24px 16px}
main{max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
img{width:120px;height:auto}
.label{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:#ffd9d6;margin:0}
h1{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.05;margin:0;text-shadow:4px 4px 0 var(--red-deep)}
p{margin:0;color:#ffe9e7}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:8px}
a.btn{display:inline-flex;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:700;font-size:.95rem;border:2px solid var(--white);color:var(--white)}
a.btn.solid{background:var(--white);color:var(--red);box-shadow:4px 4px 0 var(--red-deep)}
hr{width:60px;border:0;border-top:2px solid #ffffff55;margin:10px 0}
</style>
</head>
<body>
<main>
  <img src="/assets/cosmic-logo.png" alt="Cosmic Works" width="280" height="432">
  <p class="label">Error 404</p>
  <h1>Esta página no existe</h1>
  <p>Puede que el enlace esté mal o que la página se haya movido.</p>
  <div class="btns">
    <a class="btn solid" href="/">Ir a la portada</a>
    <a class="btn" href="/aprende/">Ver los artículos</a>
  </div>
  <hr>
  <p lang="en">This page doesn't exist. <a href="/en/" style="color:#fff;font-weight:600">Go to the English site</a>.</p>
</main>
</body>
</html>
